name: Build Installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/sha/branch) to build
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build CLI jar
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew --no-daemon :cli:shadowJar
        shell: bash

      - name: Package distribution for current OS
        run: ./gradlew --no-daemon :ui:packageDistributionForCurrentOS
        shell: bash

      - name: Locate artifacts (macOS)
        if: matrix.os == 'macos-latest'
        id: paths_macos
        run: |
          echo "path=ui/build/compose/binaries/main/dmg" >> $GITHUB_OUTPUT

      - name: Locate artifacts (Windows)
        if: matrix.os == 'windows-latest'
        id: paths_windows
        run: |
          "path=ui/build/compose/binaries/main/msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Locate artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        id: paths_linux
        run: |
          echo "path=ui/build/compose/binaries/main/deb" >> $GITHUB_OUTPUT

      - name: Show produced files
        run: |
          echo "Artifacts in $ART_PATH" && ls -la "$ART_PATH"
        env:
          ART_PATH: ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}
        shell: bash

      - name: Generate SHA256 checksums
        run: |
          cd "$ART_PATH"
          shopt -s nullglob
          for f in *.dmg *.msi *.deb; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" >> CHECKSUMS.txt || sha256sum "$f" >> CHECKSUMS.txt || certutil -hashfile "$f" SHA256 >> CHECKSUMS.txt || true
            fi
          done
          cat CHECKSUMS.txt || true
        env:
          ART_PATH: ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}/*.dmg
            ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}/*.msi
            ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}/*.deb
            ${{ steps.paths_macos.outputs.path || steps.paths_windows.outputs.path || steps.paths_linux.outputs.path }}/CHECKSUMS.txt

      - name: Upload CLI jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: broxy-cli-jar
          path: cli/build/libs/broxy-cli*.jar

  release:
    name: Publish Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: List downloaded files
        run: |
          ls -R dist

      - name: Generate unified checksums
        run: |
          cd dist
          shopt -s globstar nullglob
          find . -name CHECKSUMS.txt -type f -delete
          : > CHECKSUMS.txt
          for f in **/*.dmg **/*.msi **/*.deb **/broxy-cli*.jar; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> CHECKSUMS.txt || shasum -a 256 "$f" >> CHECKSUMS.txt || true
          done
          cat CHECKSUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/**/*.dmg
            dist/**/**/*.msi
            dist/**/**/*.deb
            dist/**/broxy-cli*.jar
            dist/CHECKSUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
