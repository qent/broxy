build:
  maxIssues: 0

config:
  validation: false

comments:
  active: false

complexity:
  active: false

coroutines:
  active: false

empty-blocks:
  active: false

exceptions:
  active: false

naming:
  active: false

performance:
  active: false

potential-bugs:
  active: false

style:
  active: false

broxy:
  active: true
  UnreferencedDeclaration:
    active: true
    useRepositoryIndex: true
    includePublicDeclarations: true
    includeInternalDeclarations: true
    includeTestSources: false
    ignoreOverriddenDeclarations: true
    allowlistSimpleNames:
      - "main"
    allowlistFqNames:
      - "io.qent.broxy.agents.application.defaultAgentService"
      - "io.qent.broxy.agents.application.emptyMcpConfigProvider"
      - "io.qent.broxy.ui.createDesktopSystemNotificationCenter"
      - "io.qent.broxy.ui.screens.generationRuntimeOptions"
      - "io.qent.broxy.ui.adapter.store.AppStore.agentNotificationPermissionRequests"
      - "io.qent.broxy.ui.adapter.store.AppStore.agentRunNotifications"
      - "io.qent.broxy.ui.adapter.store.AppStore.clearAgentGenerationError"
      - "io.qent.broxy.ui.adapter.store.AppStore.listServerConfigs"
    allowlistFqNamePrefixes: []
    excludedPathRegexes:
      - ".*/generated/.*"
